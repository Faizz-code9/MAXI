name: MiniMax CI Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Libraries for PDF Export
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite with Pytest
        run: |
          pytest src/tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: warn

      - name: Verify Core Modules Integrity
        run: |
          python -c "import sys; sys.path.insert(0, 'src/backend'); import app, models, transcriber, preprocessor, extractor, generator; print('All core modules imported successfully.')"

      - name: Smoke Test - Server Starts and Responds (MM-NF-005)
        run: |
          python src/backend/app.py > server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          curl --fail --silent --show-error \
               --retry 10 --retry-delay 1 --retry-connrefused \
               http://127.0.0.1:5000/api/health
          echo
          echo "Server responded to health check."

      - name: Print Server Log on Failure
        if: failure()
        run: cat server.log || true