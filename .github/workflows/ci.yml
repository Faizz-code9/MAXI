name: MiniMax CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite with Pytest
        run: |
          pytest src/tests/ -v --tb=short

      - name: Verify Core Modules Integrity
        run: |
          python -c "import sys; sys.path.insert(0, 'src/backend'); import app, models, transcriber, preprocessor, extractor, generator; print('All core modules imported successfully.')"
